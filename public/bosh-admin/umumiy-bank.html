<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umumiy bank boshqaruvi - Nazorat</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/super-admin/umumiy-bank.js"></script>
  </head>
  <body>
    <main class="container stack" id="main">
      <a href="/bosh-admin/index.html">Bosh admin paneli</a>
      <h1>Umumiy test banki va tariflar</h1>
      <p id="bank-status" role="status"></p>
      <section class="card stack">
        <h2>Tarif yoki maktab ruxsatlari</h2>
        <form id="bank-policy" class="stack">
          <label
            >Tur<select id="policy-type">
              <option value="tariff">Tarif</option>
              <option value="school">Maktab</option>
            </select></label
          >
          <label
            >Tarif IDsi yoki maktabning ichki IDsi<input id="policy-target" required maxlength="100"
          /></label>
          <label>Maktab uchun tarif IDsi<input id="policy-tariff" maxlength="100" /></label>
          <p>
            Maktab qoidalarida "Tarifdan" tanlansa tarif ruxsati ishlaydi. Maktab IDsi bosh panelda mavjud.
          </p>
          <div id="policy-rules" class="stack"></div>
          <button class="btn">Saqlash</button>
        </form>
        <h3>Saqlangan qoidalar</h3>
        <div id="saved-policies"></div>
      </section>
      <section class="stack">
        <h2>Ulashishga yuborilgan testlar</h2>
        <div id="bank-review" class="stack"></div>
      </section>
    </main>
  </body>
</html>
