<!doctype html>
<!-- Testni ishlash: bu sahifa faqat markup saqlaydi. -->
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nazorat — maktablar uchun onlayn test platformasi." />
    <title>Testni ishlash — Nazorat</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/student/test.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Asosiy qismga o'tish</a>
    <div id="student-header"></div>
    <dialog id="image-preview" class="image-preview" aria-label="Rasmni kattalashtirib ko'rish">
      <button class="btn secondary" type="button" data-image-close>Yopish</button>
      <img alt="" />
    </dialog>
    <main id="main" class="student-main">
      <section hidden class="hidden" id="test" aria-label="Test savollari">
        <div class="test-layout">
          <div class="stack">
            <article class="card">
              <div class="row between">
                <span class="badge test-question-number" id="question-number"></span
                ><button class="btn ghost small" id="flag">☆ Keyinroq qaytaman</button>
              </div>
              <h2 id="question-title" class="question-title" tabindex="-1"></h2>
              <div id="options" class="options" role="radiogroup" aria-labelledby="question-title"></div>
              <div class="spacing-3 row between test-navigation">
                <button class="btn secondary" id="prev">← Oldingi</button
                ><button class="btn" id="next">Keyingi →</button>
              </div>
            </article>
            <p class="help">Klaviatura: 1–6 yoki A–F — javob, ← → — savollar orasida o'tish.</p>
            <p id="terr" class="error" role="alert"></p>
          </div>
          <aside>
            <div class="card map-timer">
              <span>Qolgan vaqt</span
              ><span id="timer" class="timer" role="timer" aria-label="Qolgan vaqt"></span>
            </div>
            <details class="card" id="map-panel">
              <summary>Savollar xaritasi</summary>
              <div id="question-map" class="question-map"></div>
              <p class="map-legend help">
                ? javob berilgan ? ! keyinroq belgilangan<br />Qalin chegara ? joriy savol
              </p>
            </details>
          </aside>
        </div>
      </section>
      <footer class="page-foot">Nazorat · O'rganing. Sinab ko'ring. Yuksaling.</footer>
    </main>
  </body>
</html>
