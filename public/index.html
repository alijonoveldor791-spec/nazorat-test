<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onlayn test</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>

<body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">N</span>Nazorat<span class="muted"> / test</span></a><button class="btn secondary" data-theme-toggle aria-label="Rang rejimini almashtirish">?</button></header>
  <div class="wrap">
    <section id="start" class="card">
      <h1>Onlayn test</h1>
      <p class="sub">Sinfingizni tanlang va testni boshlang</p>
      <label class="f">Sinf</label>
      <select id="grade">
        <option value="">Yuklanmoqda…</option>
      </select>
      <label class="f">Test</label>
      <select id="tsel" disabled>
        <option value="">Avval sinfni tanlang</option>
      </select>
      <label class="f">Ism</label><input id="name" autocomplete="given-name">
      <label class="f">Familiya</label><input id="surname" autocomplete="family-name">
      <div id="serr" class="err"></div>
      <button id="go">Testni boshlash</button>
    </section>

    <section id="test" class="hide">
      <h1 id="ttl"></h1>
      <div class="bar">
        <div id="prog"></div>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
      </div>
      <div id="qs"></div>
      <div id="terr" class="err"></div>
      <button id="send">Yakunlash va yuborish</button>
    </section>

    <section id="done" class="card hide">
      <h1 style="text-align:center">Natijangiz</h1>
      <p class="sub" style="text-align:center" id="dt"></p>
      <div class="score" id="score"></div>
      <p class="sub" style="text-align:center" id="who"></p>
      <div class="grid" id="grid"></div>
      <p class="muted" style="margin-top:14px">Natija o’qituvchiga yuborildi. Yashil — to’g’ri, qizil — noto’g’ri javob.
      </p>
    </section>
  </div>
  <script>
    const $ = id => document.getElementById(id), L = "ABCDEF";
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let T = null, ans = [];
    async function init() {
      try {
        const g = await (await fetch("/api/grades")).json();
        $("grade").innerHTML = g.length ? '<option value="">Sinfni tanlang</option>' + g.map(x => `<option>${esc(x)}</option>`).join("") : '<option value="">Hozircha testlar yo’q</option>'
      }
      catch (e) { $("grade").innerHTML = '<option value="">Yuklab bo’lmadi</option>' }
    }
    $("grade").onchange = async () => {
      const g = $("grade").value, s = $("tsel");
      s.disabled = true; s.innerHTML = '<option value="">Yuklanmoqda…</option>'; $("serr").textContent = "";
      if (!g) { s.disabled = true; s.innerHTML = '<option value="">Avval sinfni tanlang</option>'; return }
      try {
        const r = await fetch("/api/tests?grade=" + encodeURIComponent(g)), l = await r.json();
        if ($("grade").value !== g) return;
        if (!r.ok) throw new Error(l.error || "Xatolik");
        s.disabled = !l.length;
        s.innerHTML = l.length ? l.map(t => `<option value="${esc(t.id)}">${esc(t.title)} (${t.count} ta savol)</option>`).join("") : '<option value="">Bu sinf uchun test yo‘q</option>'
      }
      catch (e) { if ($("grade").value !== g) return; s.disabled = true; s.innerHTML = '<option value="">Yuklab bo‘lmadi</option>'; $("serr").textContent = e.message }
    };
    $("go").onclick = async () => {
      $("serr").textContent = "";
      if (!$("grade").value || !$("tsel").value || !$("name").value.trim() || !$("surname").value.trim()) { $("serr").textContent = "Iltimos, barcha maydonlarni to’ldiring."; return }
      $("go").disabled = true;
      try {
        const r = await fetch("/api/test/" + $("tsel").value); T = await r.json(); if (!r.ok) throw new Error(T.error);
        ans = Array(T.questions.length).fill(null); $("ttl").textContent = T.title; $("prog").textContent = "0 / " + T.questions.length;
        $("qs").innerHTML = T.questions.map((q, i) => `<div class="card"><div class="q">${i + 1}. ${esc(q.q)}</div>${q.options.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${L[j]}) ${esc(o)}</label>`).join("")}</div>`).join("");
        $("start").classList.add("hide"); $("test").classList.remove("hide"); scrollTo(0, 0)
      }
      catch (e) { $("serr").textContent = "Testni yuklab bo’lmadi: " + e.message }
      $("go").disabled = false
    };
    document.addEventListener("change", e => {
      const m = /^q(\d+)$/.exec(e.target.name || ""); if (!m) return;
      ans[m[1]] = +e.target.value; const n = ans.filter(a => a !== null).length;
      $("prog").textContent = n + " / " + ans.length; $("fill").style.width = n / ans.length * 100 + "%"
    });
    $("send").onclick = async () => {
      const left = ans.filter(a => a === null).length;
      if (left && !confirm(left + " ta savolga javob berilmagan. Baribir yuborasizmi?")) return;
      $("send").disabled = true; $("terr").textContent = "";
      try {
        const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ testId: T.id, name: $("name").value, surname: $("surname").value, grade: $("grade").value, answers: ans }) });
        const d = await r.json(); if (!r.ok) throw new Error(d.error || "Xatolik");
        $("test").classList.add("hide"); $("done").classList.remove("hide");
        $("dt").textContent = d.title; $("score").textContent = d.score + " / " + d.total;
        $("who").textContent = $("surname").value + " " + $("name").value + " · " + $("grade").value;
        $("grid").innerHTML = d.results.map((ok, i) => `<span class="${ok ? "y" : "n"}">${i + 1}</span>`).join(""); scrollTo(0, 0)
      }
      catch (e) { $("terr").textContent = "Yuborib bo’lmadi: " + e.message + ". Qayta urinib ko’ring."; $("send").disabled = false }
    };
    init();
  </script>
<script type="module" src="/assets/common.js"></script></body>

</html>
