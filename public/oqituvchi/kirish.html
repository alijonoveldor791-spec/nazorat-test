<!doctype html>
<!-- O’qituvchi paneliga kirish: bu sahifa faqat markup saqlaydi. -->
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nazorat — maktablar uchun onlayn test platformasi." />
    <title>O’qituvchi paneliga kirish — Nazorat</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/teacher/login.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Asosiy qismga o’tish</a>
    <main id="main">
      <div id="login" class="login-wrap">
        <a class="brand" href="/"
          ><span class="brand-mark">N</span>Nazorat <span class="muted">/ maktab</span></a
        >
        <section class="card">
          <div class="eyebrow">O’QITUVCHI PANELI</div>
          <h1>Xush kelibsiz.</h1>
          <p>Testlar va o’quvchilar natijalari bir joyda.</p>
          <form id="login-form" class="stack">
            <div>
              <label for="pw">Parol</label>
              <div class="password-field">
                <input
                  id="pw"
                  type="password"
                  autocomplete="current-password"
                  required
                  minlength="6"
                  maxlength="12"
                  aria-describedby="password-help"
                  placeholder="Parolingizni kiriting"
                />
                <button
                  type="button"
                  class="btn secondary password-toggle"
                  data-password-toggle="pw"
                  aria-controls="pw"
                  aria-pressed="false"
                  aria-label="Parolni ko’rsatish"
                >
                  Ko’rsatish
                </button>
              </div>
              <p id="password-help" class="help">Parol 6–12 belgidan iborat bo’lsin.</p>
            </div>
            <p id="lerr" class="error" role="alert"></p>
            <button id="enter" class="btn">Panelga kirish →</button>
          </form>
        </section>
        <div class="spacing-1 row between">
          <a href="/">← O’quvchi sahifasi</a
          ><button class="btn secondary icon" data-theme-toggle aria-label="Rang rejimini almashtirish">
            ◐
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
