<!doctype html>
<!-- Natijangiz: bu sahifa faqat markup saqlaydi. -->
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nazorat — maktablar uchun onlayn test platformasi." />
    <title>Natijangiz — Nazorat</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/student/result.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Asosiy qismga o'tish</a>
    <div id="student-header"></div>
    <main id="main" class="student-main">
      <section hidden id="done" class="stack hidden">
        <div class="card result-hero">
          <span class="badge success">TEST YAKUNLANDI</span>
          <h1 class="spacing-1">Yaxshi harakat qildingiz!</h1>
          <p id="dt"></p>
          <div class="result-score" id="score"></div>
          <h2 id="result-percent"></h2>
          <p id="motivation"></p>
          <p id="result-note" class="help" role="status"></p>
          <p id="who" class="spacing-2"></p>
          <div id="result-map" class="result-map"></div>
          <p class="help">✓ — to'g'ri, × — noto'g'ri. Natija o'qituvchi paneliga yuborildi.</p>
          <a class="spacing-3 btn secondary" href="/">Bosh sahifaga qaytish</a>
        </div>
        <div id="review"></div>
      </section>
      <footer class="page-foot">Nazorat · O'rganing. Sinab ko'ring. Yuksaling.</footer>
    </main>
  </body>
</html>
